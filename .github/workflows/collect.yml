name: collect

# Раз в час. Чаще нет смысла: публичные списки обновляются реже, а результат всё равно
# кешируется на CDN. Cron в GitHub Actions не обязателен по времени — задержка в несколько
# минут нормальна и ни на что здесь не влияет.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Если предыдущий прогон ещё идёт, новый ждёт: два одновременных коммита в один файл
# гарантированно конфликтуют.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  # Сбор и замер вынесены в job без права записи в репозиторий. Здесь запускается сторонний
  # бинарник (xray-knife), и если бы рядом лежал токен, чужой код мог бы им воспользоваться и
  # подменить список серверов сразу всем пользователям. Права на запись есть только у второго
  # job, который ничего чужого не запускает.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать кандидатов
        run: python collect.py collect

      - name: Поставить xray-knife
        run: |
          curl -sSL -o knife.zip \
            https://github.com/lilendian0x00/xray-knife/releases/latest/download/Xray-knife-linux-64.zip
          unzip -o -q knife.zip -d knife
          chmod +x "$(find knife -name xray-knife -type f | head -1)"
          echo "KNIFE=$(find knife -name xray-knife -type f | head -1)" >> "$GITHUB_ENV"

      - name: Замерить скорость
        # Замер — не повод ронять прогон. Если инструмент не отработал или сменил флаги,
        # публикуем то, что есть, с сортировкой по отклику: хуже, чем хотелось, но лучше,
        # чем пустой список у пользователей. Флаги видны в логе ниже.
        continue-on-error: true
        # Вывод пишется и в лог Actions, и в файл. Файл потом попадает в репозиторий: искать
        # причину в веб-интерфейсе Actions неудобно, а лежащий в репозитории файл можно просто
        # открыть. Прогресс-бары из вывода вырезаны, иначе файл распухнет до мегабайтов.
        run: |
          {
            echo "=========== какие флаги умеет эта версия ==========="
            "$KNIFE" http --help || true

            echo "=========== попытка 1: вывод в CSV ==========="
            "$KNIFE" http -f work/candidates.txt --speedtest --type csv -o work/speed.csv || true

            echo "=========== попытка 2: без флагов вывода ==========="
            # В свежих версиях результаты уходят в собственную базу SQLite, а флагов вывода
            # в файл может не быть вовсе. Тогда читаем базу напрямую.
            if [ ! -s work/speed.csv ]; then
              "$KNIFE" http -f work/candidates.txt --speedtest || true
              python collect.py dbdump || true
            fi

            echo "=========== что получилось ==========="
            wc -l work/speed.csv 2>/dev/null || echo "результата замера нет"
            echo "--- заголовок и три строки ---"
            head -4 work/speed.csv 2>/dev/null
            ls -la ~/.xray-knife/ 2>/dev/null || echo "каталога ~/.xray-knife нет"
          } 2>&1 \
            | tr '\r' '\n' \
            | grep -v -e '^\s*$' -e 'Testing configs' \
            | head -200 \
            | tee work/knife.log

      - uses: actions/upload-artifact@v4
        with:
          name: work
          path: work/
          retention-days: 1

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: work
          path: work/

      - name: Отранжировать и записать
        run: |
          mkdir -p debug
          # Заголовок замера и вывод ранжирования тоже кладём в репозиторий: без них
          # непонятно, почему список отсортирован так, а не иначе.
          head -1 work/speed.csv > debug/speed-header.txt 2>/dev/null || true
          python collect.py rank 2>&1 | tee debug/last-rank.log

      - name: Опубликовать результат
        run: |
          git config user.name "collector"
          git config user.email "collector@users.noreply.github.com"
          # Лог замера кладём рядом с результатом: пока конвейер не отлажен, его нужно уметь
          # прочитать, не заходя в интерфейс Actions.
          mkdir -p debug
          cp work/knife.log debug/last-speedtest.log 2>/dev/null || true
          git add configs debug
          # Без изменений выходим спокойно: пустой коммит уронил бы job, а это не ошибка.
          git diff --cached --quiet && echo "изменений нет" && exit 0
          git commit -m "configs: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
